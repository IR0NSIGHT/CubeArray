# CubeArray visual language. Keep custom colours named with a Color suffix so FlatLaf
# does not infer a non-colour value type.
@accentColor = #3B7DED
App.brandColor = #3B7DED
App.successColor = #2E9B61
App.warningColor = #C88418
App.dangerColor = #D95757
App.searchHighlightColor = #FFE08A

Component.arc = 10
Component.focusWidth = 1
Button.arc = 10
Button.margin = 7, 16, 7, 16
TextField.arc = 10
TextField.margin = 6, 10, 6, 10
TextArea.arc = 10
ProgressBar.arc = 999
ProgressBar.trackArc = 999
ScrollBar.width = 12
ScrollBar.track = $Panel.background
ScrollBar.thumb = $App.secondaryForeground
ScrollBar.thumbArc = 999
ScrollBar.showButtons = false
TabbedPane.tabHeight = 40
TabbedPane.tabInsets = 0, 16, 0, 16
TabbedPane.selectedBackground = $Panel.background
TabbedPane.showTabSeparators = false
TabbedPane.showContentSeparator = false
Table.rowHeight = 52
Table.showHorizontalLines = false
Table.showVerticalLines = false
Table.intercellSpacing = 0, 0
Table.selectionBackground = #00000000
Table.selectionForeground = $Table.foreground
Tree.showDefaultIcons = false
Tree.showLines = false
List.selectionBackground = $App.brandSoftColor
List.selectionForeground = $List.foreground
Tree.selectionBackground = $App.brandSoftColor
Tree.selectionForeground = $Tree.foreground
Tree.selectionArc = 8
PopupMenu.arc = 10
MenuItem.selectionBackground = $App.surfaceHoverColor
PopupMenu.borderColor = $App.borderColor
TextField.disabledForeground = $App.secondaryForeground

[light]App.surfaceColor = $Panel.background
[light]App.borderColor = #D9E0EA
[light]App.surfaceHoverColor = #F2F5F9
[light]App.secondaryForeground = #667085
[light]App.brandSoftColor = #1A3B7DED
[light]App.successSoftColor = #182E9B61
[light]App.warningSoftColor = #18C88418
[light]App.dangerSoftColor = #18D95757
[light]App.chipBackgroundColor = #1A3B7DED
[light]App.chipBorderColor = #503B7DED

[dark]App.surfaceColor = $Panel.background
[dark]App.borderColor = #3A4656
[dark]App.surfaceHoverColor = #263141
[dark]App.secondaryForeground = #AAB5C5
[dark]App.brandSoftColor = #303B7DED
[dark]App.successSoftColor = #302E9B61
[dark]App.warningSoftColor = #30C88418
[dark]App.dangerSoftColor = #30D95757
[dark]App.chipBackgroundColor = #303B7DED
[dark]App.chipBorderColor = #603B7DED

.muted = foreground: $App.secondaryForeground
.brand = foreground: $App.brandColor
.success = foreground: $App.successColor
.warning = foreground: $App.warningColor
.danger = foreground: $App.dangerColor
Button.primary = background: $App.brandColor; foreground: #FFFFFF
Button.ghost = background: transparent; borderColor: transparent
Button.danger = background: $App.dangerColor; foreground: #FFFFFF
TextField.search = borderColor: $App.brandColor
